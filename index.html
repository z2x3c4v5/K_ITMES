<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-Items Shop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: a Korean shopping street — striped shop awning on top, level aisles (초급/중급/고급), product cards like a mall app with 원 prices and 담기 buttons; the 장바구니 page writes every sentence on 4-line English notebook paper. */
:root {
  --bg: #FFF4F1;
  --surface: #FFFFFF;
  --surface-2: #FFF0EC;
  --line: #F3D9D2;
  --ink: #2B1F24;
  --muted: #7A6268;
  --accent: #F0435A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FFE1E5;
  --mint: #12A88F;
  --mint-soft: #DDF5F0;
  --sun: #FFCF33;
  --sun-ink: #3A2C00;
  --lv1: #22A06B; --lv1-soft: #E0F6EA;
  --lv2: #E58A00; --lv2-soft: #FFF0D6;
  --lv3: #7A4CE0; --lv3-soft: #EEE6FF;
  --photo-bg: #FFFFFF;
  --paper: #FFFDF6;
  --rule: #8DB0DC;
  --rule-mid: #B9CEE9;
  --rule-red: #E0605B;
  --pencil: #1F2A44;
  --pencil-hl: #D6304A;
  --margin-red: #F2B8B5;
  --rec: #E5383B;
  --shadow: 0 2px 4px rgba(120,40,50,.06), 0 10px 24px rgba(120,40,50,.08);
  --f-display: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --f-body: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-note: "Andika", "Comic Sans MS", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1416; --surface: #261C1F; --surface-2: #31252A; --line: #44343A;
    --ink: #F6ECEE; --muted: #B9A3A9; --accent: #FF6B7E; --accent-ink: #2A0710; --accent-soft: #4A2129;
    --mint: #45D1B8; --mint-soft: #173A34; --sun: #F5C431; --sun-ink: #2A2000;
    --lv1: #5BD69C; --lv1-soft: #173A2A; --lv2: #FFB547; --lv2-soft: #3D2C12; --lv3: #B497FF; --lv3-soft: #2E2547;
    --photo-bg: #F7F2F3;
    --paper: #F6F2E6; --pencil-hl: #C62840;
    --shadow: 0 2px 4px rgba(0,0,0,.3), 0 10px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1416; --surface: #261C1F; --surface-2: #31252A; --line: #44343A;
  --ink: #F6ECEE; --muted: #B9A3A9; --accent: #FF6B7E; --accent-ink: #2A0710; --accent-soft: #4A2129;
  --mint: #45D1B8; --mint-soft: #173A34; --sun: #F5C431; --sun-ink: #2A2000;
  --lv1: #5BD69C; --lv1-soft: #173A2A; --lv2: #FFB547; --lv2-soft: #3D2C12; --lv3: #B497FF; --lv3-soft: #2E2547;
  --photo-bg: #F7F2F3;
  --paper: #F6F2E6; --pencil-hl: #C62840;
  --shadow: 0 2px 4px rgba(0,0,0,.3), 0 10px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.2; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* shop sign */
.awning { height: 22px; background: repeating-linear-gradient(90deg, var(--accent) 0 36px, #FFFFFF 36px 72px); position: relative; }
.awning::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px; background: radial-gradient(circle at 18px -2px, var(--accent) 12px, transparent 13px) 0 0 / 72px 10px repeat-x, radial-gradient(circle at 54px -2px, #FFFFFF 12px, transparent 13px) 0 0 / 72px 10px repeat-x; }
header.top { background: var(--surface); }
header.top .wrap { padding-block: 26px 18px; display: grid; gap: 8px; }
.sign-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.shopname { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
h1 { font-size: clamp(28px, 5.4vw, 44px); }
h1 .blank { display: inline-block; min-width: 3.4em; color: var(--accent); border-bottom: 4px dotted var(--sun); }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); box-shadow: 0 1px 0 var(--line); }
nav.tabs .wrap { display: flex; gap: 6px; padding-block: 8px; }
nav.tabs a { flex: 1; max-width: 240px; text-decoration: none; color: var(--muted); padding: 10px 14px; font-weight: 700; font-size: 15px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.badge { background: var(--sun); color: var(--sun-ink); font-size: 12px; border-radius: 999px; padding: 0 8px; min-width: 22px; text-align: center; font-weight: 900; }

main .wrap { padding-block: 22px 64px; display: grid; gap: 18px; }
section.view { display: grid; gap: 18px; }

/* mall header */
.awning.thin { height: 12px; }
.awning.thin::after { display: none; }
header.mall-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); box-shadow: 0 1px 0 var(--line); }
header.mall-top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.logo { font-family: var(--f-display); font-size: 22px; color: var(--ink); text-decoration: none; white-space: nowrap; }
.logo b { color: var(--accent); font-weight: 400; }
.search { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 2px solid transparent; border-radius: 999px; padding: 0 14px; min-width: 0; }
.search:focus-within { border-color: var(--accent); background: var(--surface); }
.search input { flex: 1; min-width: 0; border: none; background: transparent; font: inherit; color: var(--ink); padding: 9px 0; outline: none; }
.cart-ico-btn { position: relative; font-size: 24px; text-decoration: none; line-height: 1; padding: 6px; }
.cart-ico-btn .badge { position: absolute; top: -4px; right: -8px; font-size: 11px; }
nav.tabs { top: calc(env(safe-area-inset-top, 0px) + 60px); }
nav.tabs .ti { font-size: 16px; }
/* banner */
.banner { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: center; border-radius: 24px; padding: 26px 24px; background: linear-gradient(120deg, var(--accent) 0%, #FF7A59 100%); color: #fff; box-shadow: var(--shadow); }
.banner::before { content: ""; position: absolute; inset: 0 0 auto; height: 10px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.9) 0 24px, transparent 24px 48px); }
.banner-txt { display: grid; gap: 8px; justify-items: start; }
.banner-tag { background: var(--sun); color: var(--sun-ink); font-weight: 900; font-size: 12px; border-radius: 999px; padding: 3px 10px; }
.banner h1 { font-size: clamp(26px, 4.6vw, 40px); color: #fff; }
.banner h1 .blank { color: var(--sun); border-bottom-color: rgba(255,255,255,.6); }
.banner p { margin: 0; font-size: 14px; opacity: .95; max-width: 46ch; }
.btn.light { background: #fff; color: #C42B42; }
.banner-pics { display: flex; justify-content: center; }
.banner-pics img { width: 34%; max-width: 120px; aspect-ratio: 1; object-fit: cover; border-radius: 18px; background: #fff; border: 3px solid #fff; box-shadow: 0 6px 16px rgba(0,0,0,.18); margin-left: -12px; transform: rotate(-6deg); }
.banner-pics img:nth-child(2) { transform: rotate(4deg) translateY(-8px); }
.banner-pics img:nth-child(3) { transform: rotate(-2deg); }
/* category icons */
.cats { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: none; }
.cat { flex: none; width: 76px; border: none; background: transparent; display: grid; justify-items: center; gap: 4px; padding: 0; }
.cat .ci { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: var(--surface); box-shadow: var(--shadow); border: 2px solid transparent; }
.cat .cl { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; line-height: 1.3; }
.cat[aria-pressed="true"] .ci { border-color: var(--accent); background: var(--accent-soft); }
.cat[aria-pressed="true"] .cl { color: var(--accent); }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.toolbar .count { margin: 0; font-size: 14px; color: var(--ink); }
.toolbar .count b { color: var(--accent); }
.sort select { font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.levels-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lv-label { font-weight: 900; font-size: 14px; }
.levels-wrap .levels { flex: 1; }
.cart-bar .sum { display: flex; flex-direction: column; gap: 2px; }
.sum-l { font-size: 13px; color: var(--muted); font-weight: 500; }
.sum-r { font-size: 15px; }
.sum-r b { font-size: 22px; color: var(--accent); }
/* level aisles */
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.lv { border: 2px solid var(--line); background: var(--surface); border-radius: 20px; padding: 14px 16px; text-align: left; display: grid; gap: 2px; box-shadow: var(--shadow); }
.lv .t { font-family: var(--f-display); font-size: 22px; display: flex; align-items: center; gap: 8px; }
.lv .d { font-size: 13px; color: var(--muted); }
.lv[data-lv="1"][aria-pressed="true"] { border-color: var(--lv1); background: var(--lv1-soft); }
.lv[data-lv="2"][aria-pressed="true"] { border-color: var(--lv2); background: var(--lv2-soft); }
.lv[data-lv="3"][aria-pressed="true"] { border-color: var(--lv3); background: var(--lv3-soft); }
.lvtag { font-size: 11px; font-weight: 900; border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.lvtag.l1 { background: var(--lv1-soft); color: var(--lv1); }
.lvtag.l2 { background: var(--lv2-soft); color: var(--lv2); }
.lvtag.l3 { background: var(--lv3-soft); color: var(--lv3); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters > span { font-size: 12px; color: var(--muted); font-weight: 700; margin-right: 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.count { font-size: 13px; color: var(--muted); margin-left: auto; }

/* product cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.card { position: relative; background: var(--surface); border-radius: 20px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; box-shadow: var(--shadow); transition: transform .15s ease; }
.card:hover { transform: translateY(-3px); }
.card .open { position: absolute; inset: 0; border: none; background: transparent; z-index: 1; border-radius: 20px; }
.photo { aspect-ratio: 4 / 3; max-width: 100%; background: var(--photo-bg); display: grid; place-items: center; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.photo .fallback { font-size: 64px; line-height: 1; }
.card-body { padding: 12px 14px 14px; display: grid; gap: 4px; align-content: start; }
.card .stores { display: flex; flex-wrap: wrap; gap: 4px; }
.store { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.card .en { font-family: var(--f-display); font-size: 21px; line-height: 1.2; }
.card .ko { font-size: 13px; color: var(--muted); margin-top: -2px; }
.price { font-weight: 900; font-size: 20px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.price small { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 4px; }
.card-where { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; background: var(--mint-soft); border-radius: 12px; padding: 7px 8px 7px 10px; font-size: 13px; font-weight: 500; line-height: 1.4; margin-top: 4px; }
.card-where small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.card-where .speak { min-width: 30px; height: 30px; padding: 0 6px; font-size: 13px; }
.card-actions { display: flex; gap: 6px; margin-top: 6px; position: relative; z-index: 2; }
.cart-btn { flex: 1; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); border-radius: 12px; padding: 6px 8px; font-weight: 700; font-size: 13px; }
.cart-btn.on { background: var(--accent); color: var(--accent-ink); }
.card .lvtag { position: absolute; top: 10px; left: 10px; z-index: 2; }
.heart { position: absolute; top: 8px; right: 8px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,.9); font-size: 17px; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.12); color: #F0435A; }

.note { background: var(--surface); border-radius: 20px; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; box-shadow: var(--shadow); }
.note b { color: var(--accent); }

/* buttons */
.speak, .mic, .play { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 36px; height: 36px; padding: 0 10px; font-size: 15px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none; }
.speak:hover, .mic:hover, .play:hover { border-color: var(--accent); }
.speak.playing { background: var(--mint); color: #fff; border-color: var(--mint); }
.mic.rec { background: var(--rec); border-color: var(--rec); color: #fff; animation: pulse 1s ease-in-out infinite; }
.play { border-color: var(--mint); color: var(--mint); font-weight: 700; font-size: 13px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(229,56,59,.25); } }
.btn { border: none; background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 11px 18px; font-weight: 700; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* clickable words */
.w { cursor: pointer; border-radius: 4px; }
span.w:hover { background: var(--sun); color: var(--sun-ink); }
svg .w:hover text { fill: var(--pencil-hl); }
.wpop { position: fixed; z-index: 30; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 12px 10px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; gap: 12px; align-items: center; max-width: min(320px, calc(100vw - 24px)); }
.wpop .we { font-family: var(--f-note); font-size: 20px; font-weight: 700; }
.wpop .wk { font-size: 14px; }
.wpop .speak { background: transparent; color: var(--bg); border-color: rgba(255,255,255,.35); }

/* detail sheet */
dialog { border: none; padding: 0; border-radius: 24px; background: var(--surface); color: var(--ink); width: min(620px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(30,10,15,.55); }
.sheet { display: grid; gap: 16px; padding: 0 0 22px; }
.sheet > :not(.sheet-photo) { margin-inline: 22px; }
.sheet-photo { position: relative; aspect-ratio: 16 / 10; max-width: 100%; background: var(--photo-bg); display: grid; place-items: center; overflow: hidden; }
.sheet-photo img { width: 100%; height: 100%; object-fit: contain; }
.sheet-photo .fallback { font-size: 96px; line-height: 1; }
.sheet-photo .x { position: absolute; top: 12px; right: 12px; }
.sheet-photo .lvtag { position: absolute; top: 14px; left: 14px; font-size: 13px; }
.x { border: none; background: rgba(255,255,255,.9); color: #2B1F24; border-radius: 50%; width: 38px; height: 38px; font-size: 18px; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.sheet-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sheet-head h2 { font-size: 32px; }
.sheet-head .ko { color: var(--muted); width: 100%; margin-top: -8px; }
.block { display: grid; gap: 8px; }
.block h3 { font-size: 18px; }
.feat { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.feat li { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 8px 10px 8px 14px; }
.feat .e { font-weight: 500; }
.feat .k { font-size: 13px; color: var(--muted); grid-column: 1; }
.feat .speak { grid-column: 2; grid-row: 1 / span 2; }
.where { display: grid; gap: 8px; }
.shoprow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; border: 1px dashed var(--line); border-radius: 14px; padding: 8px 10px 8px 14px; }
.shoprow b { display: block; }
.shoprow .sub { font-size: 12px; color: var(--muted); }
.shoprow .p { font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
.talk { display: grid; gap: 8px; }
.bubble { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.bubble .who { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: var(--surface-2); }
.bubble .txt { background: var(--surface-2); border-radius: 16px 16px 16px 4px; padding: 8px 14px; font-size: 17px; font-weight: 500; }
.bubble.b .txt { background: var(--mint-soft); border-radius: 16px 16px 4px 16px; }
.bubble .txt small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.tip { font-size: 14px; background: var(--sun); color: var(--sun-ink); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.tip .speak { background: rgba(255,255,255,.6); }
.pick-btn { border: none; background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 14px 16px; font-weight: 900; font-size: 17px; }
.pick-btn.on { background: var(--accent-soft); color: var(--accent); }
.go { text-align: center; font-size: 14px; color: var(--accent); font-weight: 700; text-decoration: none; }

/* cart */
.cart-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 20px; padding: 12px 14px; box-shadow: var(--shadow); }
.cart-bar .sum { font-weight: 700; }
.cart-bar .sum b { color: var(--accent); font-size: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: none; background: transparent; padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.mine-list { display: grid; gap: 22px; }
.mine-item { background: var(--surface); border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); }
.mine-head { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 16px; align-items: center; }
.mine-head .photo { border-radius: 16px; border: 1px solid var(--line); }
.mine-head h2 { font-size: 28px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mine-head .ko { color: var(--muted); font-size: 14px; }
.mine-head .row { margin-top: 6px; }
.howto { font-size: 12px; color: var(--muted); padding: 0 16px 10px; }
.notebook { background: var(--paper); background-image: linear-gradient(90deg, transparent 0 46px, var(--margin-red) 46px 48px, transparent 48px); padding: 18px 16px 22px 60px; display: grid; gap: 4px; color: var(--pencil); border-top: 1px solid var(--line); }
.nb-sec { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #6B7A93; margin: 10px 0 0; }
.nb-sec:first-child { margin-top: 0; }
.sent { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; border-radius: 8px; }
.sent.now { background: rgba(255, 207, 51, .3); }
.sent .staffs { min-width: 0; display: grid; gap: 2px; }
.sent svg { display: block; width: 100%; height: auto; overflow: visible; }

function meaning(word) {
  const w = word.toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9']+$/g, "");
  if (DICT[w]) return DICT[w];
  if (w.includes("-")) { const parts = w.split("-").map(p => DICT[p]); if (parts.every(Boolean)) return parts.map(p => p.split(",")[0]).join(" + "); }
  if (/^[\d,]+$/.test(w)) return w + " (숫자)";
  return "";
}

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const won = n => n.toLocaleString("en-US") + "원";
const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function under1000(n) {
  const parts = [];
  if (n >= 100) { parts.push(ONES[Math.floor(n / 100)] + " hundred"); n %= 100; }
  if (n >= 20) parts.push(TENS[Math.floor(n / 10)] + (n % 10 ? "-" + ONES[n % 10] : ""));
  else if (n > 0) parts.push(ONES[n]);
  return parts.join(" ");
}
function numWords(n) {
  if (n === 0) return "zero";
  const th = Math.floor(n / 1000), rest = n % 1000;
  return [th ? under1000(th) + " thousand" : "", rest ? under1000(rest) : ""].filter(Boolean).join(" ");
}
const priceWords = n => numWords(n) + " won";
const storesOf = it => it.stores;
const byId = id => ITEMS.find(x => x.id === id);
function sing(en) { return /(ss|sh|ch|x)es$/.test(en) ? en.slice(0, -2) : en.replace(/s$/, ""); }
const sayBtn = (text, label = "듣기") => `<button class="speak" type="button" data-say="${esc(text)}" aria-label="${esc(label)}">🔊</button>`;
/* wrap every English word so it can be clicked */
const wordsHTML = text => esc(text).split(/(\s+)/).map(t => /\S/.test(t) ? `<span class="w" data-w="${t}">${t}</span>` : t).join("");
function photoHTML(it, cls = "photo") {
  return `<div class="${cls}"><img src="images/${it.id}.jpg" alt="${esc(it.en)}" loading="lazy" data-emoji="${it.emoji}"></div>`;
}
document.addEventListener("error", e => {
  const img = e.target;
  if (img.tagName === "IMG" && img.dataset.emoji) {
    const s = document.createElement("span");
    s.className = "fallback"; s.textContent = img.dataset.emoji; s.setAttribute("aria-hidden", "true");
    img.replaceWith(s);
  }
}, true);
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2000);

let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) {} }
const canSpeak = "speechSynthesis" in window;
if (canSpeak) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
let playingEls = [];
function clearPlaying() { playingEls.forEach(el => el.classList.remove("playing", "now")); playingEls = []; }
function speakSeq(list) {
  if (!canSpeak) { toast("이 브라우저는 영어 듣기를 지원하지 않아요."); return; }
  try {
    speechSynthesis.cancel(); clearPlaying();
    const v = voices.find(v => /^en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
    list.forEach(([text, el]) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.85; if (v) u.voice = v;
      u.onstart = () => { clearPlaying(); if (el) { el.classList.add(el.classList.contains("sent") ? "now" : "playing"); playingEls.push(el); } };
      u.onend = () => { if (el) el.classList.remove("playing", "now"); };
      speechSynthesis.speak(u);
    });
  } catch (e) {}
}
const speak = (text, el) => speakSeq([[text, el]]);

const NB = { mode: "read", ko: true };
const measureCtx = document.createElement("canvas").getContext("2d");
let xRatio = 0.53;
function measureFont() {
  measureCtx.font = `400 100px Andika, "Comic Sans MS", sans-serif`;
  const m = measureCtx.measureText("x");
  if (m.actualBoundingBoxAscent) xRatio = m.actualBoundingBoxAscent / 100;
}
function sentenceSegs(segs) {
  return segs.map(s => (NB.mode === "blank" && s.blank) ? { t: "m".repeat(Math.max(4, Math.min(12, Math.round(s.t.length * 0.6)))), hl: true, gap: true } : s);
}
function layoutStaffs(segs, width, fs) {
  measureCtx.font = `400 ${fs}px Andika, "Comic Sans MS", sans-serif`;
  const tokens = [];
  segs.forEach(s => (s.gap ? [s.t] : s.t.split(/(\s+)/)).forEach(w => { if (w) tokens.push({ ...s, t: w }); }));
  const lines = [[]]; let x = 0;
  tokens.forEach(tok => {
    measureCtx.font = `${tok.hl ? 700 : 400} ${fs}px Andika, "Comic Sans MS", sans-serif`;
    const w = measureCtx.measureText(tok.t).width;
    const isSpace = /^\s+$/.test(tok.t);
    if (!isSpace && x + w > width && lines[lines.length - 1].length) { lines.push([]); x = 0; }
    if (isSpace && x === 0) return;
    lines[lines.length - 1].push({ ...tok, x, w }); x += w;
  });
  return lines.map(l => { while (l.length && /^\s+$/.test(l[l.length - 1].t)) l.pop(); return l; });
}
function drawSentence(el) {
  const segs = sentenceSegs(JSON.parse(el.dataset.segs));
  const box = el.querySelector(".staffs");
  const W = Math.max(160, box.clientWidth);
  const H = W < 420 ? 42 : 60;
  const fs = (H / 3) / xRatio;
  const top = 4, mid = top + H / 3, base = top + H * 2 / 3, bot = top + H, total = bot + 6;
  const lines = layoutStaffs(segs, W - 10, fs);
  box.innerHTML = lines.map(line => {
    const words = line.map(t => {
      if (t.gap) return `<line x1="${(t.x + 4).toFixed(1)}" x2="${(t.x + 4 + t.w).toFixed(1)}" y1="${base - 2}" y2="${base - 2}" stroke="var(--pencil-hl)" stroke-width="2.5" stroke-linecap="round"/>`;
      if (/^\s+$/.test(t.t)) return "";
      if (!/[A-Za-z0-9]/.test(t.t)) return `<text x="${(t.x + 4).toFixed(1)}" y="${base}" font-family="Andika, 'Comic Sans MS', sans-serif" font-size="${fs.toFixed(1)}" fill="var(--pencil)">${esc(t.t)}</text>`;
      return `<g class="w" data-w="${esc(t.t)}"><rect x="${(t.x + 2).toFixed(1)}" y="${top}" width="${(t.w + 4).toFixed(1)}" height="${H}" fill="transparent"/><text x="${(t.x + 4).toFixed(1)}" y="${base}" font-family="Andika, 'Comic Sans MS', sans-serif" font-size="${fs.toFixed(1)}" fill="${t.hl ? "var(--pencil-hl)" : "var(--pencil)"}"${t.hl ? ` font-weight="700"` : ""}>${esc(t.t)}</text></g>`;
    }).join("");
    return `<svg viewBox="0 0 ${W} ${total}" width="${W}" height="${total}">
      <line x1="0" x2="${W}" y1="${top}" y2="${top}" stroke="var(--rule)" stroke-width="1"/>
      <line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--rule-mid)" stroke-width="1" stroke-dasharray="5 4"/>
      <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--rule-red)" stroke-width="1.4"/>
      <line x1="0" x2="${W}" y1="${bot}" y2="${bot}" stroke="var(--rule)" stroke-width="1"/>
      ${words}
    </svg>`;
  }).join("");
  box.setAttribute("aria-label", JSON.parse(el.dataset.segs).map(s => s.t).join(""));
}

/* same items and prices at every level; only the feature sentences change */
function priceSection(it) {
  return [
    { segs: [{ t: "How much are the " }, { t: it.en, hl: true, blank: true }, { t: "?" }], ko: `${it.ko.replace(/ \(.*\)$/, "")} 얼마예요?` },
    { segs: [{ t: "They're " }, { t: priceWords(it.price), hl: true, blank: true }, { t: "." }], ko: `${won(it.price)}이에요.`, clerk: true }
  ];

/* Korean particle after a word: 받침 → a, otherwise b */
const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1); return w + ((c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? a : b); };
/* where to buy: 초급 one shop · 중급 two shops · 고급 a longer sentence */
function whereFor(it) {
  const [a, b] = it.stores, [pa, A] = STORES_EN[a], [pb, B] = b ? STORES_EN[b] : [];
  const ka = STORES[a], kb = b && STORES[b];

  if (state.lv === 2) return [B
    ? { segs: [S(`You can buy them ${pa} `), S(A, 1), S(` or ${pb} `), S(B, 1), S(".")], ko: `${josa(ka, "이나", "나")} ${kb}에서 살 수 있어요.` }

  return [B
    ? { segs: [S("If you go to "), S(A, 1), S(`, you can find them easily, and they are also sold ${pb} `), S(B, 1), S(".")], ko: `${ka}에 가면 쉽게 찾을 수 있고, ${kb}에서도 팔아요.` }
    : { segs: [S(`Tourists often buy them ${pa} `), S(A, 1), S(" during their trip to Busan.")], ko: `관광객들은 부산 여행 중에 ${ka}에서 자주 사요.` }];
}

/* ---------- microphone: record my voice ---------- */

const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim();
function stopRec() {
  if (!rec) return;
  clearTimeout(rec.timer);

  if (rec.dict) rec.dict.stop().catch(() => {});
}
function record(sent, btn) {
  if (rec) { const same = rec.sent === sent; stopRec(); if (same) return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      const chunks = [];
      const mr = new MediaRecorder(stream);
      mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove("rec"); btn.textContent = "🎤";
        const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
        if (sent._url) URL.revokeObjectURL(sent._url);
        sent._url = URL.createObjectURL(blob); sent._audio = new Audio(sent._url);
        sent.querySelector(".play").hidden = false;
        rec = null;
        toast("녹음 완료! ▶ 내 목소리를 눌러 들어 보세요.");
      };
      mr.start();
      btn.classList.add("rec"); btn.textContent = "⏹";
      rec = { mr, stream, sent, btn, timer: setTimeout(stopRec, 10000) };
      toast("🎤 녹음 중… 문장을 말하고 ⏹을 누르세요");
    }).catch(() => useDictation(sent, btn));
  } else useDictation(sent, btn);
}
let dictT = null;          /* {sent, btn, text} for the current dictation */
function hookDictation(d) {
  d.onFinal(({ text: t }) => { if (dictT) dictT.text += (dictT.text ? " " : "") + t; });
  d.onPartial(({ text: t }) => {
    if (!dictT) return;
    const h = dictT.sent.querySelector(".heard");
    h.hidden = false; h.className = "heard"; h.textContent = "🎤 " + (dictT.text + " " + t).trim();
  });
  d.onState(({ state }) => {
    if (!dictT) return;
    const { sent, btn, text } = dictT;
    if (state === "listening") { btn.classList.add("rec"); btn.textContent = "⏹"; return; }
    if (state !== "idle") return;
    btn.classList.remove("rec"); btn.textContent = "🎤"; rec = null; dictT = null;
    if (!text) return;
    const said = norm(text), goal = norm(sent.dataset.full);
    const ok = said === goal || (goal.includes(said) && said.length > goal.length * 0.7);
    const h = sent.querySelector(".heard");
    h.hidden = false; h.className = "heard" + (ok ? "" : " no");
    h.textContent = (ok ? "✅ 잘했어요! " : "🔁 다시 해 봐요: ") + "“" + text + "”";
  });
}
function useDictation(sent, btn) {
  if (!dictation) { toast("마이크를 쓸 수 없어요. 브라우저에서 마이크를 허용해 주세요."); return; }
  dictT = { sent, btn, text: "" };
  dictation.start().then(() => { rec = { sent, btn, dict: dictation, timer: setTimeout(stopRec, 10000) }; })
    .catch(() => { dictT = null; toast("마이크를 쓸 수 없어요."); });
}

/* ---------- routing ---------- */
const VIEWS = ["shop", "mine"];
function route() {
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "shop";
  VIEWS.forEach(k => { $("#view-" + k).hidden = k !== v; });
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.view === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  /* the level picker sits under the categories on the shop page and on top of the cart */
  const lw = $(".levels-wrap");
  if (v === "shop") $("#view-shop").insertBefore(lw, $(".toolbar")); else $("#view-mine").prepend(lw);
  if (v === "mine") drawAllNotebooks();
  if (route.last && route.last !== v) scrollTo(0, 0);
  route.last = v;
  try { speechSynthesis.cancel(); } catch (e) {}
  clearPlaying(); stopRec(); wpop.hidden = true;
}
addEventListener("hashchange", route);

let hi = 0;
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!reduce) setInterval(() => { hi = (hi + 1) % ITEMS.length; $("#heroWord").textContent = ITEMS[hi].en; }, 2200);
$("#heroSpeak").onclick = () => speak(`How much are the ${$("#heroWord").textContent}?`, $("#heroSpeak"));
$("#q").addEventListener("input", e => { state.q = e.target.value; if (location.hash === "#mine") location.hash = "#shop"; renderGrid(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; renderGrid(); });
$("#bannerPics").innerHTML = ["sheet-masks", "socks", "fish-cakes"].map(id => `<img src="images/${id}.jpg" alt="" data-emoji="${byId(id).emoji}">`).join("");

measureFont();
buildStoreFilter();
updateMineCount();
renderGrid();
renderMine();
route();
if (document.fonts && document.fonts.load) {
  document.fonts.load(`400 40px Andika`).then(() => { measureFont(); drawAllNotebooks(); }).catch(() => {});
}
